apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: demo
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: app-a
          image: coroot-poc-app:v1
          imagePullPolicy: Never
          env:
            - name: APP_ROLE
              value: app-a
            - name: APP_B_URL
              value: http://app-b:8080
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://coroot-coroot.coroot:8080/v1/traces
            - name: COROOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: coroot-poc-api-key
                  key: api-key
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "X-API-Key=$(COROOT_API_KEY)"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app-a
  namespace: demo
spec:
  type: NodePort
  selector:
    app: app-a
  ports:
    - port: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-b
  template:
    metadata:
      labels:
        app: app-b
    spec:
      containers:
        - name: app-b
          image: coroot-poc-app:v1
          imagePullPolicy: Never
          env:
            - name: APP_ROLE
              value: app-b
            - name: REDIS_HOST
              value: redis
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://coroot-coroot.coroot:8080/v1/traces
            - name: COROOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: coroot-poc-api-key
                  key: api-key
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "X-API-Key=$(COROOT_API_KEY)"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app-b
  namespace: demo
spec:
  selector:
    app: app-b
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load-generator
          image: coroot-poc-app:v1
          imagePullPolicy: Never
          command: ["python", "-u", "-c"]
          args:
            - |
              import time
              import requests
              i = 0
              session = requests.Session()
              while True:
                  i += 1
                  scenario = "error" if i % 20 == 0 else "slow" if i % 5 == 0 else "normal"
                  try:
                      r = session.get("http://app-a:8080/checkout", params={"scenario": scenario}, timeout=10)
                      expected = 502 if scenario == "error" else 200
                      print(f"scenario={scenario} status={r.status_code} expected={expected} body={r.text.strip()}", flush=True)
                      if r.status_code != expected:
                          print("ERROR: unexpected response", flush=True)
                  except requests.RequestException as exc:
                      print(f"ERROR: {exc}", flush=True)
                  time.sleep(1)
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
